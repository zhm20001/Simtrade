name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'core/**'
      - 'assets/**'
      - 'watcher.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas requests

      - name: Prepare clean sample data
        run: |
          python -c "
          import json, os
          os.makedirs('data', exist_ok=True)
          with open('data/watchlist.json','w',encoding='utf-8') as f:
              json.dump({'groups':[{'name':'示例','codes':['sh600519','sz000858','sh600900','sh600011']}],'active_group':0,'fields':{'volume':True,'high_low':True,'turnover':True,'amount':False},'refresh_interval':3,'font_size':13,'window_width':320,'window_height':None,'opacity':0.95}, f, ensure_ascii=False, indent=2)
          with open('data/portfolio.json','w',encoding='utf-8') as f:
              json.dump({'account_id':'sim_001','cash':1000000.0,'positions':{},'initial_cash':1000000.0,'created_at':'','updated_at':''}, f, ensure_ascii=False, indent=2)
          with open('data/strategy.json','w',encoding='utf-8') as f:
              json.dump({'rules':[]}, f, ensure_ascii=False, indent=2)
          with open('data/stock_names.json','w',encoding='utf-8') as f:
              json.dump({}, f)
          print('Sample data ready')
          "

      - name: Build EXE
        run: |
          pyinstaller watcher.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watcher-windows
          path: dist/极简盯盘/
          retention-days: 30
