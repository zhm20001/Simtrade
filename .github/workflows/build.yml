name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'core/**'
      - 'assets/**'
      - 'watcher.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas requests

      - name: Prepare clean sample data
        shell: bash
        run: |
          cat > data/watchlist.json << 'EOF'
          {
            "groups": [
              {
                "name": "示例",
                "codes": ["sh600519", "sz000858", "sh600900", "sh600011"]
              }
            ],
            "active_group": 0,
            "fields": {
              "volume": true,
              "high_low": true,
              "turnover": true,
              "amount": false
            },
            "refresh_interval": 3,
            "font_size": 13,
            "window_width": 320,
            "window_height": null,
            "opacity": 0.95
          }
          EOF
          cat > data/portfolio.json << 'EOF'
          {
            "account_id": "sim_001",
            "cash": 1000000.0,
            "positions": {},
            "initial_cash": 1000000.0,
            "created_at": "",
            "updated_at": ""
          }
          EOF
          cat > data/strategy.json << 'EOF'
          {"rules": []}
          EOF
          echo '{}' > data/stock_names.json

      - name: Build EXE
        run: |
          pyinstaller watcher.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watcher-windows
          path: dist/极简盯盘/
          retention-days: 30
