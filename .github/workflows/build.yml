name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'core/**'
      - 'assets/**'
      - 'watcher.spec'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            suffix: win64
          - arch: x86
            suffix: win32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          pip install pyinstaller pandas requests

      - name: Prepare clean sample data
        run: |
          python -c "
          import json, os
          os.makedirs('data', exist_ok=True)
          with open('data/watchlist.json','w',encoding='utf-8') as f:
              json.dump({'groups':[{'name':'示例','codes':['sh600519','sz000858','sh600900','sh600011']}],'active_group':0,'fields':{'volume':True,'high_low':True,'turnover':True,'amount':False},'refresh_interval':3,'font_size':13,'window_width':320,'window_height':None,'opacity':0.95}, f, ensure_ascii=False, indent=2)
          with open('data/portfolio.json','w',encoding='utf-8') as f:
              json.dump({'account_id':'sim_001','cash':1000000.0,'positions':{},'initial_cash':1000000.0,'created_at':'','updated_at':''}, f, ensure_ascii=False, indent=2)
          with open('data/strategy.json','w',encoding='utf-8') as f:
              json.dump({'rules':[]}, f, ensure_ascii=False, indent=2)
          with open('data/stock_names.json','w',encoding='utf-8') as f:
              json.dump({}, f)
          print('Sample data ready')
          "

      - name: Build EXE
        run: |
          pyinstaller watcher.spec

      - name: Package as zip
        run: |
          Compress-Archive -Path "dist/极简盯盘/*" -DestinationPath "极简盯盘-${{ matrix.suffix }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: watcher-${{ matrix.suffix }}
          path: 极简盯盘-${{ matrix.suffix }}.zip
          retention-days: 30

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
